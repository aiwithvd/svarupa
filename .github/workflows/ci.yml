name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: ruff
        run: uv run ruff check svarupa tests
      - name: ruff format check
        run: uv run ruff format --check svarupa tests
      - name: pyright
        run: uv run pyright svarupa

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev --python ${{ matrix.python }}
      - name: pytest
        run: uv run pytest -q

  # The determinism suite is the highest-value test in the project. If it
  # regresses, every PR shows architecture changes that did not happen, teams
  # learn to ignore the check, and the governance pillar is worthless.
  determinism:
    name: determinism ${{ matrix.os }} py${{ matrix.python }} seed=${{ matrix.hashseed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        hashseed: ["0", "12345", "random"]
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev --python ${{ matrix.python }}
      - name: determinism suite
        run: uv run pytest -q -m determinism

  # Gate 2 from Spike 0, deferred at the time because a Docker daemon was not
  # available locally. Renders the same corpus on Linux and macOS and asserts
  # the bytes match. A hash mismatch here means the lockfile is not portable,
  # which breaks per-PR diffing at the root.
  cross-platform-bytes:
    name: byte identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      # Builds from a real fixture tree on disk, not an in-memory string.
      # An in-memory corpus is pure str manipulation and can essentially never
      # differ across platforms, so it verified the serializer's determinism
      # rather than the product's. NFD paths, dirent ordering and
      # case-insensitive volumes only enter through an actual filesystem walk.
      - name: build from a real fixture tree
        run: uv run python scripts/render_fixture_lock.py lockfile.out
      - name: hash
        run: |
          python3 -c "
          import hashlib, pathlib
          b = pathlib.Path('lockfile.out').read_bytes()
          print(f'sha256={hashlib.sha256(b).hexdigest()}  bytes={len(b)}')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile-${{ matrix.os }}
          path: lockfile.out

  compare-bytes:
    needs: cross-platform-bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assert Linux and macOS bytes are identical
        run: |
          a=artifacts/lockfile-ubuntu-latest/lockfile.out
          b=artifacts/lockfile-macos-latest/lockfile.out
          if ! cmp -s "$a" "$b"; then
            echo "::error::lockfile bytes differ between Linux and macOS"
            diff <(cat -A "$a") <(cat -A "$b") | head -40
            exit 1
          fi
          echo "byte identity confirmed: $(sha256sum "$a" | cut -d' ' -f1)"
