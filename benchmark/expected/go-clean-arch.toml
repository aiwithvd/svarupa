why = "internal/repository/helper.go:1 package repository"

[[must]]
record = ["module", "internal/repository/mysql"]
why = "internal/repository/mysql/article.go:1 package mysql"

[[must]]
record = ["module", "internal/rest"]
why = "internal/rest/article.go:1 package rest"

[[must]]
record = ["module", "internal/rest/middleware"]
why = "internal/rest/middleware/cors.go:1 package middleware"

