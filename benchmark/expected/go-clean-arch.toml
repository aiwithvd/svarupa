# Calls
[[must]]
call = "app/main.go -> internal/repository/mysql/author.go#NewAuthorRepository"
why = "app/main.go:76 authorRepo := mysqlRepo.NewAuthorRepository(dbConn)"

[[must]]
call = "app/main.go -> internal/repository/mysql/article.go#NewArticleRepository"
why = "app/main.go:77 articleRepo := mysqlRepo.NewArticleRepository(dbConn)"

[[must]]
call = "app/main.go -> article/service.go#NewService"
why = "app/main.go:80 svc := article.NewService(articleRepo, authorRepo)"

[[must]]
call = "app/main.go -> internal/rest/article.go#NewArticleHandler"
why = "app/main.go:81 rest.NewArticleHandler(e, svc)"

[[must]]
call = "app/main.go -> internal/rest/middleware/timeout.go#SetRequestContextWithTimeout"
why = "app/main.go:73 e.Use(middleware.SetRequestContextWithTimeout(timeoutContext))"

[[must]]
call = "internal/repository/mysql/article.go -> internal/repository/helper.go#DecodeCursor"
why = "internal/repository/mysql/article.go:67 decodedCursor, err := repository.DecodeCursor(cursor)"

# Probes
[[must_not]]
record = ["dep", "internal/repository/mysql", "internal/rest"]
why = "the repository layer never imports the delivery layer; it imports only domain and internal/repository"

[[must_not]]
record = ["dep", "article", "internal/repository/mysql"]
why = "the service declares its own repository interfaces and never imports the MySQL implementation; app wires them"

[[must_not]]
record = ["dep", "domain", "article"]
why = "domain imports no repo package; it is the innermost layer"

[[must_not]]
record = ["module", "article/mocks"]
why = "article/mocks holds only mockery-generated files (Code generated by mockery v2.42.0. DO NOT EDIT.)"

[[must_not]]
record = ["datastore", "postgres"]
why = "compose.yaml defines only web and mysql; the app opens a mysql driver"

[[must_not]]
call = "article/service.go -> internal/repository/mysql/article.go#GetByID"
why = "GetByID is a method on *ArticleRepository, reached from the service only through the ArticleRepository interface"

# Health violations (counted by hand from source)
[[must_not]]
violation = "complex-function internal/repository/helper.go:13"
why = "internal/repository/helper.go:13 func DecodeCursor(encodedTime): complexity 2, 11 lines, 1 parameter"

[[must_not]]
violation = "complex-function internal/repository/mysql/author.go:38"
why = "internal/repository/mysql/author.go:38 func (m *AuthorRepository) GetByID(ctx, id): complexity 1, 4 lines, 2 parameters"

[[must_not]]
violation = "long-function article/service.go:38"
why = "article/service.go:38 func NewService(a, ar): 6 lines, complexity 1"

# Design (decided by reading source)
# clean: entities = domain; usecases = article (service); adapters =
# internal/rest, internal/rest/middleware, internal/repository,
# internal/repository/mysql; app wires them. The service and both adapters
# import only domain; the service declares its repository interfaces itself.
[[must]]
design = ". clean"
why = "article/service.go:10 \"github.com/bxcodec/go-clean-arch/domain\" (the use case imports only the domain entities, never rest or mysql)"

[[must_not]]
design = ". mvc"
why = "no views and no controller/model split; the code is split into domain, a service and rest/mysql adapters"
