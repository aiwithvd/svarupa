# go-clean-arch: bxcodec/go-clean-arch @ e06c6d0cb370 (v4 layout)
# Module: github.com/bxcodec/go-clean-arch (go.mod).
# Read: README.md, go.mod, compose.yaml, example.env, app/main.go,
# article/service.go, domain/*.go, internal/repository/helper.go,
# internal/repository/mysql/*.go, internal/rest/article.go,
# internal/rest/middleware/*.go.
# Layers: app (wiring) -> internal/rest (Echo delivery) and article (service)
# and internal/repository/mysql (MySQL repository); all inner layers depend
# only on domain. Interfaces are declared on the consuming side.
# Not expected on purpose:
# - endpoint records: routes are Echo router calls, not a supported route
#   declaration for this benchmark.
# - modules for article/mocks and internal/rest/mocks: generated by mockery
#   ("Code generated ... DO NOT EDIT").
# - calls through interfaces (svc.Fetch, a.articleRepo.GetByID): not
#   statically resolvable to one function.

# Modules
[[must]]
record = ["module", "app"]
why = "app/main.go:1 package main"

[[must]]
record = ["module", "article"]
why = "article/service.go:1 package article"

[[must]]
record = ["module", "domain"]
why = "domain/article.go:1 package domain"

[[must]]
