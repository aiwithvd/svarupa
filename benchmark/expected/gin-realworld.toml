# Probes
[[must_not]]
record = ["dep", "users", "articles"]
why = "users never imports articles; the dependency only goes articles -> users"

[[must_not]]
record = ["dep", "common", "users"]
why = "common imports no repo package; it is the shared base layer"

[[must_not]]
call = "articles/routers.go -> users/models.go#SaveOne"
why = "articles/routers.go calls the bare SaveOne of its own package (articles/models.go:144); users.SaveOne is a different function with the same name"

[[must_not]]
record = ["datastore", "postgres"]
why = "no docker-compose file and no Postgres driver; the only database is SQLite via gorm.io/driver/sqlite"

[[must_not]]
record = ["module", "api"]
why = "api/ holds only a shell script and a Postman collection, no Go source"

[[must_not]]
call = "hello.go -> articles/models.go#Update"
why = "Update is a method on *ArticleModel, not a top-level function, and hello.go never calls it"

