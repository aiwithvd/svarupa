# gin-realworld: gothinkster/golang-gin-realworld-example-app @ 626c372d2594
# Module: github.com/gothinkster/golang-gin-realworld-example-app (go.mod).
# Read: readme.md, go.mod, .env.example, hello.go (main), and every non-test
# .go file in articles/, users/ and common/.
# Layout: feature packages (articles, users) on top of a shared common package
# (GORM over SQLite, JWT, validation helpers). The root package main wires them.
# Not expected on purpose:
# - endpoint records: routes are Gin router calls, which are not a supported
#   route declaration for this benchmark.
# - datastore/queue/service records: the repo has no docker-compose file.
#   SQLite is opened in-process through gorm.io/driver/sqlite.

# Modules
[[must]]
record = ["module", "."]
why = "hello.go:1 package main"

[[must]]
record = ["module", "articles"]
why = "articles/routers.go:1 package articles"

[[must]]
record = ["module", "users"]
why = "users/routers.go:1 package users"

[[must]]
record = ["module", "common"]
why = "common/database.go:1 package common"

