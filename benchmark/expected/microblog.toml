# microblog (Miguel Grinberg's Flask Mega-Tutorial app), pinned commit.
# Read: README, requirements.txt, config.py, Procfile, boot.sh, Dockerfile,
# microblog.py, app/__init__.py, the blueprints (main, auth, api, errors),
# app/models.py, app/search.py, app/email.py, app/tasks.py, app/translate.py.
# Not expected on purpose:
# - compose services / datastores / queues: the repo has no docker-compose or
#   compose file. PostgreSQL, Elasticsearch and Redis/RQ are only reached
#   through env URLs in config.py, so no compose-based record exists.
# - entrypoints: no pyproject.toml, so no [project.scripts].
# - endpoint paths with blueprint url_prefix (/auth, /api): the prefix is set
#   in app/__init__.py register_blueprint, not in the route decorator.

