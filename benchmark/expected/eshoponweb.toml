# eShopOnWeb @ 4da8212117e8
# Read: README.md, every .cs file under src/ApplicationCore, src/Infrastructure,
# src/PublicApi, src/BlazorShared and src/Web (services, controllers, pages,
# features and configuration).
# Not expected on purpose:
# - tests/: test projects are classified as test code.
# - calls to the Ardalis.Specification repository methods (AddAsync,
#   FirstOrDefaultAsync, ListAsync): IRepository<T> only inherits them from an
#   external package, so they are not declared in the repo.
# - calls on `var` locals whose type comes from those repository calls
#   (`basket.AddItem(...)`), on LINQ results, and through MediatR.
# - Razor .cshtml views, which are not C# files.
# - endpoints: routes are ASP.NET attributes and minimal API lambdas, not
#   framework route declarations that this benchmark counts.
# - datastores: SQL Server and an in-memory EF Core provider are chosen in
#   code (Dependencies.cs), with no compose file.
# - the root namespace is Microsoft.eShopWeb, which starts with Microsoft.
#   Facts below still hold because the namespaces are declared in the repo.

