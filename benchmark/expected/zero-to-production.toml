# zero-to-production @ 970987c5f793
# Read: Cargo.toml, README.md and every .rs file under src/ (the zero2prod crate:
# startup, configuration, domain, routes, authentication, idempotency, the
# issue delivery worker and telemetry).
# Not expected on purpose:
# - tests/: the black-box API tests are classified as test code.
# - sql: migrations/ and the sqlx::query! macro bodies are not Rust symbols.
# - routes: actix routes are wired with App::route(...).to(handler) in
#   startup.rs, not declared with attribute macros.
# - calls through macro-generated or trait-resolved values (form.0.try_into(),
#   session.get_user_id() on the TypedSession local in middleware.rs,
#   application.run_until_stopped() on a value returned by build()).
# - consts and type aliases (USER_ID_KEY, PgTransaction): not symbols yet.
# - datastores: Postgres and Redis are configured through YAML under
#   configuration/, not through a compose file.
# - src is one crate, so the module for lib.rs, main.rs and the flat files is
#   the directory src itself; dependencies between flat files are not module
#   dependencies.

