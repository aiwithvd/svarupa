# fastapi-template (full-stack-fastapi-template), pinned commit.
# Read: README, backend/pyproject.toml, root pyproject.toml, compose.yml,
# compose.override.yml, backend/app (main, api/main, api/deps, api/routes/*,
# crud, models, core/*, utils, initial_data), frontend/tsconfig.json and
# frontend/src/routes + hooks imports.
# Not expected on purpose:
# - entrypoints: neither pyproject declares [project.scripts].
# - frontend/src/client: generated OpenAPI client, left out of module facts.
# - endpoint paths with the APIRouter prefix (/items, /users, /utils, /private)
#   or the /api/v1 include prefix, per the record rules.

