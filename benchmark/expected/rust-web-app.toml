# rust-web-app @ fc681fc9e476
# Read: README.md, every Cargo.toml and every .rs file under crates/ (the
# lib-utils, lib-auth, lib-core, lib-rpc-core and lib-web libraries, the
# web-server service and the gen-key tool).
# Not expected on purpose:
# - sql/ and web-folder/: SQL scripts and static files, not Rust.
# - the generated CRUD methods (generate_common_bmc_fns!, generate_common_rpc_fns!):
#   macro output has no declaration in the repo, so calls like ConvBmc::create
#   and ConvBmc::list are not expected.
# - calls through values returned by other calls (get_scheme(name)?.hash(...),
#   mm.dbx().begin_txn()) and on closure parameters.
# - consts, statics and type aliases (AUTH_TOKEN, DEFAULT_SCHEME, Db): they are
#   not symbols yet.
# - examples/quick_dev.rs: an httpc-test client, not part of the server.
# - endpoints: routes are built with axum Router::route, not a framework
#   route declaration this benchmark counts.
# - datastores: the Postgres URL is read from the environment at run time.

