# spring-petclinic @ 500158f73241
# Read: README.md, pom.xml, docker-compose.yml, application*.properties,
# PetClinicApplication, PetClinicRuntimeHints, every class under model/, owner/,
# system/ and vet/ in src/main/java.
# Not expected on purpose:
# - endpoint records: routes are Spring @GetMapping/@PostMapping annotations,
#   which this benchmark does not treat as route declarations.
# - calls to inherited Spring Data methods (save, saveAndFlush on JpaRepository),
#   since those methods are not declared in the repo.
# - k8s/db.yml is a Kubernetes manifest, not a compose file, so its postgres
#   deployment is not a compose service.
# The import graph is small: only four cross-package deps exist in main code.

