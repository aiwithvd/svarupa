# spring-boot-realworld-example-app @ ee17e31aafe7
# Read: README.md, build.gradle, application.properties, RealWorldApplication,
# the REST layer (api/), GraphQL layer (graphql/), application services and
# query services (application/), domain (core/) and MyBatis infrastructure
# (infrastructure/).
# Not expected on purpose:
# - endpoint records: REST routes are Spring @RequestMapping/@GetMapping
#   annotations and GraphQL uses DGS @DgsData, neither counts as a route
#   declaration for this benchmark.
# - compose services: the repo has no docker-compose file. The database is a
#   SQLite file through JDBC (application.properties), not a compose service.
# - deps on io.spring.graphql.types and io.spring.graphql.DgsConstants: those
#   classes are generated by the DGS codegen plugin into build/ and are not in
#   the repo.
# - calls through the field without "this." are used here because the code
#   never writes "this.field.method()"; every field cited has a single
#   unambiguous declared type in the same class.

