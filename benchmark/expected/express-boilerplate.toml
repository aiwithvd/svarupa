# express-boilerplate: hagopj13/node-express-boilerplate at 179ae84.
# Read: README, package.json, the four docker-compose files, src/index.js,
# src/app.js, src/config/*, every route, controller, service, model and
# middleware file.
# Endpoint path assumption: routers are mounted in other files
# (src/app.js app.use('/v1', routes) and src/routes/v1/index.js
# router.use('/auth' | '/users' | '/docs', ...)), so each endpoint path is
# given as written at the route call, without the /v1/auth or /v1/users prefix.
# "GET /" is not expected because it is declared by both user.route.js and
# docs.route.js. Not expected either way: src/docs (holds swaggerDef.js next
# to YAML docs) and bin/ (the create-app CLI, not part of the API).

