# Design (decided by reading source)
# Layered: src/routes/v1 is the api layer, src/controllers sits under it and
# hands off to src/services (service), which use the mongoose models in
# src/models (data). Imports only run routes -> controllers -> services ->
# models; config, middlewares, utils and validations are shared helpers.
[[must]]
design = ". layered"
why = "src/controllers/user.controller.js:5 const { userService } = require('../services');"
[[must_not]]
design = ". clean"
why = "no entities or usecases directories; business logic in src/services talks to mongoose models directly, so there is no pure core"
