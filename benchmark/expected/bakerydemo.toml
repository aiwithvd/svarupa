# bakerydemo (Wagtail demo site, Django), pinned commit.
# Read: readme.md, requirements.txt, docker-compose.yml, Dockerfile,
# manage.py, bakerydemo/settings/*, bakerydemo/urls.py, bakerydemo/api.py,
# the apps (base, blog, breads, locations, people, recipes, search) and
# base/management/commands.
# Not expected on purpose:
# - endpoints: this is a Django/Wagtail project (urls.py path() and Wagtail
#   page routing), which the endpoint record does not cover.
# - entrypoints: no pyproject.toml, so no [project.scripts].
# - bakerydemo/static/js: small browser scripts served as static assets; left
#   out rather than asserted as an application module.
# - Elasticsearch: only mentioned as an optional search backend in settings,
#   not a compose service.

