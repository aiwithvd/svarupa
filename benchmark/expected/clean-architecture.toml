# CleanArchitecture @ 345e7fe7612f
# Read: README.md, CleanArchitecture.slnx, every .cs file under src/ (Application,
# Domain, Infrastructure, Web, Shared, AppHost, ServiceDefaults).
# Not expected on purpose:
# - tests/ and templates/: test projects are classified as test code and left
#   out of the module graph.
# - calls on a `var` local whose type comes from a generic or LINQ call
#   (for example `initialiser.InitialiseAsync()`), on extension methods, and
#   through MediatR (`sender.Send`) or EF Core (`_context.Database`): their
#   targets are external or need type inference.
# - `global using` lines (Domain/GlobalUsings.cs and the others): they apply to
#   the whole project, so the plain `using` lines are cited instead.
# - endpoints: routes are declared with MapPost/MapPut calls on route groups,
#   not as framework route attributes.
# - datastores and compose services: the database comes from .NET Aspire
#   (AppHost/Program.cs) behind #if directives, with no compose file.
# One call fact (TodoItem -> BaseEntity#AddDomainEvent) needs the base class
# BaseAuditableEntity, which TodoItem.cs only sees through Domain/GlobalUsings.cs.
# It is listed because the call is real in the source.

