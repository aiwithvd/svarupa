# go-clean-template: evrone/go-clean-template @ d40c828aa650
# Module: github.com/evrone/go-clean-template (go.mod).
# Read: README.md, go.mod, docker-compose.yml, docker-compose-integration-test.yml,
# cmd/app/main.go, config/config.go, internal/app/app.go, the routers of every
# controller (restapi, grpc, amqp_rpc, nats_rpc), internal/usecase/**,
# internal/repo/**, internal/entity, and the pkg/ constructors.
# Layers: controllers (restapi on Fiber, gRPC, RabbitMQ RPC, NATS RPC) depend on
# internal/usecase contracts; use case implementations depend on internal/repo
# contracts and internal/entity; repo implementations use pkg/postgres or an
# HTTP web API. internal/app wires everything together.
# Not expected on purpose:
# - endpoint records: routes are Fiber/gRPC registrations, not a supported
#   route declaration for this benchmark.
# - modules for docs/ and docs/proto/v1: all files there are generated
#   (swaggo and protoc-gen-go, "DO NOT EDIT").
# - calls through use case or repo interfaces: not statically resolvable.
# - internal/app/migrate.go facts: it is behind the "migrate" build tag.

